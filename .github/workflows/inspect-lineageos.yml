name: Inspect LineageOS OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-lineageos.yml"
      - "scripts/inspect_ota.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Drive downloader
        run: python -m pip install --upgrade gdown

      - name: Prepare Go for payload-dumper-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - name: Install payload inspector
        run: |
          sudo apt-get update
          sudo apt-get install -y liblzma-dev
          go install github.com/ssut/payload-dumper-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Show runner storage
        run: df -h .

      - name: Download publicly shared Google Drive folder
        id: download
        continue-on-error: true
        env:
          DRIVE_URL: "https://drive.google.com/drive/folders/1SWjco5A8nD8ml8GjiaqNKxORHI3YXXmC?usp=sharing"
        run: |
          mkdir -p downloads
          gdown "$DRIVE_URL" -O downloads --continue --retries 3 --timeout 90

      - name: Inventory OTA and payload metadata
        env:
          OTA_DOWNLOAD_DIR: downloads
          OTA_REPORT_DIR: inspection
        run: python3 scripts/inspect_ota.py

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-ota-inspection
          path: inspection/
          if-no-files-found: warn
          retention-days: 30
